spring:
  main:
    allow-bean-definition-overriding: true

jwt:
  signer-key: "12345678901234567890123456789012"
  valid-duration: 3600
  refreshable-duration: 86400

app:
  webhook-base-url: "http://localhost:8080/codelearning"
  webhook-secret: "test_secret_12345"

google:
  client-id: "test-google-client-id"

auth:
  cookie:
    access-token:
      name: access_token
      secure: false
      max-age: 3600
      http-only: true
      same-site: Lax
      path: /
    refresh-token:
      name: refresh_token
      secure: false
      max-age: 604800
      http-only: true
      same-site: Lax
      path: /

sendgrid:
  api-key: "SG.test-api-key"
  from-email: "noreply@codelearning.com"
  from-name: "CodeLearning"
  webhook-public-key: "test-public-key"

judge0:
  base-url: "http://localhost:2358"
  timeout: 5s

payos:
  client-id: "test-client-id"
  api-key: "test-api-key"
  checksum-key: "test-checksum-key"
  return-url: "http://localhost:5173/payment/success"
  cancel-url: "http://localhost:5173/payment/cancel"
  base-url: "https://api-merchant.payos.vn"
  timeout: 5s

