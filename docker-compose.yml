version: '3.8'

# Định nghĩa cấu hình logging chung để sử dụng lại qua các anchor (<<: *default-logging)
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

services:
  # --- MODULE 1: HẠ TẦNG CỐT LÕI CỦA ỨNG DỤNG CHÍNH (CODELEARNING WEB APP) ---
  # Module này sẽ CHẠY MẶC ĐỊNH
  db:
    image: postgres:15-alpine
    container_name: codelearning_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codelearning_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    build:
      context: ./backend
      dockerfile: Dockerfile.rabbitmq
    container_name: codelearning_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelearning_app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    <<: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelearning_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - app
    <<: *default-logging

  # --- MODULE 2: HẠ TẦNG CHẤM BÀI CHUYÊN BIỆT (JUDGE0 SANDBOX) ---
  # Đã gắn profile "judge0". Sẽ KHÔNG chạy mặc định.
  judge0-server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    container_name: judge0_codelearning_server
    env_file: judge0.conf
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    container_name: judge0_codelearning_workers
    command: [ "./scripts/workers" ]
    env_file: judge0.conf
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:16.2
    container_name: judge0_codelearning_db
    env_file: judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U judge0 -d judge0" ]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: always

  judge0-redis:
    image: redis:7.2.4
    container_name: judge0_codelearning_redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    healthcheck:
      test: ["CMD", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: always

volumes:
  postgres_data:
  redis_data:
  judge0_postgres_data: