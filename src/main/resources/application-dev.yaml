server:
  port: 8080
  servlet:
    context-path: /codelearning

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codelearning}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        '[default_batch_fetch_size]': 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}


jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:600}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:1200}

auth: 
  cookie:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}
      max-age: ${ACCESS_TOKEN_MAX_AGE:600}
      secure: ${ACCESS_TOKEN_SECURE:false}
      http-only: ${ACCESS_TOKEN_HTTP_ONLY:true}
      same-site: ${ACCESS_TOKEN_SAME_SITE:Lax}
      path: ${ACCESS_TOKEN_PATH:/}

    refresh-token:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
      max-age: ${REFRESH_TOKEN_MAX_AGE:1200}
      secure: ${REFRESH_TOKEN_SECURE:false}
      http-only: ${REFRESH_TOKEN_HTTP_ONLY:true}
      same-site: ${REFRESH_TOKEN_SAME_SITE:Lax}
      path: ${REFRESH_TOKEN_PATH:/codelearning/auth}

judge0:
  #base-url: ${JUDGE0_URL:http://thanhmila.local:2358/}
  base-url: ${JUDGE0_URL:https://humility-reflector-unarmored.ngrok-free.dev}
  timeout: 20s

websocket:
  allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173

app:
  #webhook-base-url: ${WEBHOOK_BASE_URL:http://macbook-pro-cua-ngoc.local:8080/codelearning}
  webhook-base-url: ${WEBHOOK_BASE_URL:https://flattered-hamburger-shakiness.ngrok-free.dev/codelearning}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: "http://localhost:8080/codelearning/payment/success.html"
  cancel-url: "http://localhost:8080/codelearning/payment/cancel.html"




