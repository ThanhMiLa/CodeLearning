<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fef2f2; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); text-align: center; max-width: 400px; }
        .icon { font-size: 64px; color: #dc2626; margin-bottom: 20px; }
        h1 { color: #dc2626; margin: 0 0 10px 0; }
        p { color: #4b5563; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: inline-block; background-color: #4b5563; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background-color 0.2s; }
        .btn:hover { background-color: #374151; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✕</div>
        <h1>Đã hủy thanh toán</h1>
        <p>Bạn đã hủy quá trình nạp Xu. Không có khoản tiền nào bị trừ khỏi tài khoản của bạn.</p>
        <a href="/" class="btn">Về trang chủ</a>
    </div>
</body>
</html>
