<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Judge - Live Evaluation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #1a1a1a;
            --bg-surface: #262626;
            --bg-overlay: #333333;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --accent-color: #00b8a3; /* Leetcode teal */
            --accent-hover: #009688;
            --border-color: #3f3f46;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar */
        .navbar {
            background-color: var(--bg-surface);
            height: 45px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            color: var(--accent-color);
        }

        /* Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Panel */
        .panel-left {
            width: 280px;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 12px 14px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .panel-content {
            padding: 12px 12px;
            flex: 1;
            overflow-y: auto;
        }

        /* Forms & Buttons */
        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 6px 8px;
            background-color: var(--bg-overlay);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 8px 10px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Status Badge */
        .status-container {
            margin-top: 12px;
            padding: 10px;
            background-color: var(--bg-overlay);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .status-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        .status-badge.connected {
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border-color: rgba(34, 197, 94, 0.2);
        }

        /* Right Panel (Console) */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e; /* VSCode terminal dark */
        }

        .console-header {
            padding: 10px 16px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-title {
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .console-title svg {
            width: 14px;
            height: 14px;
        }
        
        .console-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 3px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            background-color: var(--bg-overlay);
        }

        .console-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(calc(25% - 8px), 1fr));
            gap: 8px;
        }

        .log-entry {
            margin-bottom: 0;
            animation: fadeIn 0.3s ease-in-out;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-overlay);
        }
        
        .log-entry:last-child {
            border-bottom: 1px solid var(--border-color);
        }

        .log-time {
            color: var(--text-secondary);
            font-size: 0.7rem;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .log-type-system { color: var(--accent-color); }
        .log-type-success { color: var(--success-color); }
        .log-type-error { color: var(--error-color); }
        .log-type-data { color: #eab308; }

        .json-pre {
            background-color: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 3px;
            margin-top: 4px;
            overflow-x: auto;
            color: #d4d4d4;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            line-height: 1.4;
            max-height: 120px;
            text-overflow: ellipsis;
        }

        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .boolean { color: #569cd6; }
        .null { color: #569cd6; }
        .key { color: #9cdcfe; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Pulse animation for connecting state */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .connecting .status-dot {
            animation: pulse 1.5s infinite ease-in-out;
            background-color: var(--warning-color);
            box-shadow: 0 0 8px var(--warning-color);
        }
        .status-badge.connecting {
            color: var(--warning-color);
            border-color: rgba(245, 158, 11, 0.3);
            background-color: rgba(245, 158, 11, 0.1);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <span class="brand-logo">&lt;/&gt;</span> CodeLearning Judge Monitor
        </div>
    </nav>

    <div class="container">
        <!-- Left Configuration Panel -->
        <div class="panel-left">
            <div class="panel-header">
                Connection Settings
            </div>
            <div class="panel-content">
                <div class="form-group">
                    <label class="form-label" for="userId">Target User ID</label>
                    <input class="form-input" type="number" id="userId" value="1" placeholder="Enter User ID...">
                </div>
                
                <button class="btn" id="connectBtn" onclick="toggleConnection()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"/></svg>
                    <span>Connect & Listen</span>
                </button>

                <div class="status-container">
                    <div class="status-title">WebSocket Status</div>
                    <div class="status-badge" id="statusBadge">
                        <div class="status-dot"></div>
                        <span id="statusText">DISCONNECTED</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Terminal/Console Panel -->
        <div class="panel-right">
            <div class="console-header">
                <div class="console-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                    Evaluation Output
                </div>
                <div class="console-actions">
                    <button class="btn-icon" onclick="clearConsole()" title="Clear Console">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                </div>
            </div>
            <div class="console-body" id="logConsole">
                <div class="log-entry">
                    <div class="log-time" id="initTime"></div>
                    <span class="log-type-system">Waiting for connection... Click "Connect & Listen" to start monitoring user submissions.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('initTime').innerText = new Date().toLocaleTimeString();
        
        var stompClient = null;
        var isConnected = false;

        // Syntax highlighting for JSON
        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function appendLog(type, message, data = null) {
            var logDiv = document.getElementById("logConsole");
            var time = new Date().toLocaleTimeString();
            
            var typeClass = 'log-type-system';
            var icon = 'ℹ️';
            
            if (type === 'success') { typeClass = 'log-type-success'; icon = '✅'; }
            else if (type === 'error') { typeClass = 'log-type-error'; icon = '❌'; }
            else if (type === 'data') { typeClass = 'log-type-data'; icon = '📥'; }

            var html = `<div class="log-entry">
                <div class="log-time">[${time}]</div>
                <div class="${typeClass}" style="font-size: 0.75rem; word-break: break-word;">${icon} ${message.substring(0, 50)}</div>`;

            if (data) {
                var jsonStr = typeof data !== 'string' ? JSON.stringify(data, null, 1) : data;
                // Limit to first 100 chars
                var preview = jsonStr.substring(0, 80);
                if (jsonStr.length > 80) preview += '...';
                html += `<pre class="json-pre">${syntaxHighlight(preview)}</pre>`;
            }
            
            html += `</div>`;
            logDiv.innerHTML += html;
            
            // Auto scroll to bottom
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearConsole() {
            var logDiv = document.getElementById("logConsole");
            logDiv.innerHTML = '';
            appendLog('system', 'Console cleared. Still listening for events...');
        }

        function updateStatus(status, userId = null) {
            var badge = document.getElementById("statusBadge");
            var text = document.getElementById("statusText");
            var btn = document.getElementById("connectBtn");
            
            badge.className = "status-badge"; // Reset classes
            
            if (status === 'connecting') {
                badge.classList.add("connecting");
                text.innerText = "CONNECTING...";
                btn.disabled = true;
                btn.style.opacity = "0.7";
            } else if (status === 'connected') {
                badge.classList.add("connected");
                text.innerText = "CONNECTED (User: " + userId + ")";
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg><span>Disconnect</span>`;
                btn.style.backgroundColor = "var(--error-color)";
            } else {
                text.innerText = "DISCONNECTED";
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"/></svg><span>Connect & Listen</span>`;
                btn.style.backgroundColor = "var(--accent-color)";
            }
        }

        function toggleConnection() {
            if (isConnected) {
                disconnectWebSocket();
            } else {
                connectWebSocket();
            }
        }

        function disconnectWebSocket() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            isConnected = false;
            updateStatus('disconnected');
            appendLog('system', 'Disconnected from server.');
        }

        function connectWebSocket() {
            var userId = document.getElementById("userId").value;
            
            if (!userId) {
                appendLog('error', 'Please enter a valid User ID.');
                return;
            }

            updateStatus('connecting');
            appendLog('system', 'Initializing connection to Spring Boot server...');

            var socket = new SockJS('http://localhost:8080/codelearning/ws');
            stompClient = Stomp.over(socket);
            
            // Tắt debug log rác của Stomp
            stompClient.debug = null;

            stompClient.connect({}, function (frame) {
                isConnected = true;
                updateStatus('connected', userId);
                appendLog('success', 'WebSocket connection established!');
                appendLog('system', `Subscribing to topic: /topic/submissions/${userId}`);

                stompClient.subscribe('/topic/submissions/' + userId, function (messageOutput) {
                    try {
                        var payload = JSON.parse(messageOutput.body);
                        appendLog('data', 'Received evaluation result for testcase:', payload);
                    } catch (e) {
                        appendLog('data', 'Received message (Raw text):', messageOutput.body);
                    }
                });
            }, function(error) {
                isConnected = false;
                updateStatus('disconnected');
                appendLog('error', 'Connection failed or lost: ' + error);
            });
        }
    </script>
</body>
</html>
