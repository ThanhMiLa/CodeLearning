<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICPC Premium Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            
            /* ICPC Colors */
            --solved-first: #10b981;
            --solved-first-bg: rgba(16, 185, 129, 0.2);
            --solved: #34d399;
            --solved-bg: rgba(52, 211, 153, 0.15);
            --failed: #ef4444;
            --failed-bg: rgba(239, 68, 68, 0.15);
            --pending: #eab308;
            --pending-bg: rgba(234, 179, 8, 0.15);
            --unattempted: rgba(255, 255, 255, 0.03);
            
            --row-hover: rgba(255, 255, 255, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .contest-info h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .contest-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.upcoming {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .status-badge.ended {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .status-badge.live {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: pulse 2s infinite;
        }

        .status-badge.live::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .leaderboard-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--panel-border);
        }

        th {
            padding: 1.25rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        th.col-rank { width: 80px; }
        th.col-team { text-align: left; min-width: 250px; }
        th.col-score { width: 100px; }
        th.col-penalty { width: 100px; }
        th.col-prob { width: 90px; }

        .prob-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .prob-letter {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .prob-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--row-hover);
            transform: scale(1.002);
            box-shadow: inset 2px 0 0 var(--accent);
        }

        td {
            padding: 0.75rem 1rem;
            height: 70px;
        }

        .rank-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
        }

        tr:nth-child(1) .rank-badge {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #fff;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        tr:nth-child(2) .rank-badge {
            background: linear-gradient(135deg, #cbd5e1, #94a3b8);
            color: #0f172a;
        }

        tr:nth-child(3) .rank-badge {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
        }

        .team-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .team-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
        }

        .team-member {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .score-solved {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .score-penalty {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-family: 'Courier New', Courier, monospace;
        }

        /* Problem Cells */
        .prob-cell {
            position: relative;
            border-radius: 6px;
            margin: 2px;
            height: 54px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        /* Solved (First) */
        .prob-cell.first {
            background: var(--solved-first-bg);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.1);
        }
        .prob-cell.first .prob-time { color: var(--solved-first); font-weight: 700; }
        .prob-cell.first .prob-tries { color: rgba(16, 185, 129, 0.8); }

        /* Solved (Normal) */
        .prob-cell.solved {
            background: var(--solved-bg);
            border-color: rgba(52, 211, 153, 0.2);
        }
        .prob-cell.solved .prob-time { color: var(--solved); font-weight: 600; }
        .prob-cell.solved .prob-tries { color: rgba(52, 211, 153, 0.8); }

        /* Failed Attempt */
        .prob-cell.failed {
            background: var(--failed-bg);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .prob-cell.failed .prob-tries { color: var(--failed); font-weight: 600; font-size: 1rem; }

        /* Unattempted */
        .prob-cell.unattempted {
            background: var(--unattempted);
        }
        
        .prob-cell.unattempted::after {
            content: '-';
            color: var(--text-muted);
            opacity: 0.3;
        }

        .prob-time {
            font-size: 0.9rem;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.2;
        }

        .prob-tries {
            font-size: 0.75rem;
            line-height: 1.2;
            margin-top: 2px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .header { padding: 1.5rem 2rem; }
            .container { padding: 0 1rem; }
            th, td { padding: 0.5rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="contest-info">
            <h1>CodeLearning Weekly Contest #42</h1>
            <p>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Time remaining: 01:24:35
            </p>
        </div>
        <div class="status-badge live">
            LIVE
        </div>
    </header>

    <main class="container">
        <div class="leaderboard-container">
            <table>
                <thead id="leaderboard-head">
                    <!-- Data will be populated here via JS -->
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Data will be populated here via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Extract contest ID from URL params, default to 2 for testing
        const urlParams = new URLSearchParams(window.location.search);
        const contestId = urlParams.get('contestId') || 3;
        
        let stompClient = null;

        // Format seconds to mm
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            return `${m}`; 
        }

        function getProblemLetter(index) {
            return String.fromCharCode(65 + index); // 0 -> A, 1 -> B...
        }

        async function fetchLeaderboard() {
            try {
                // Fetch from the real API
                const response = await fetch(`/codelearning/contests/${contestId}/leaderboard`);
                const result = await response.json();
                
                if (result.code === 200 && result.result) {
                    renderContestInfo(result.result);
                    renderLeaderboard(result.result.leaderboard, result.result.status);
                }
            } catch (error) {
                console.error("Failed to fetch leaderboard:", error);
            }
        }

        function renderContestInfo(data) {
            const headerTitle = document.querySelector('.contest-info h1');
            const headerTime = document.querySelector('.contest-info p');
            const badge = document.querySelector('.status-badge');
            const mainContainer = document.querySelector('.leaderboard-container');

            if (data.title) {
                headerTitle.textContent = data.title;
            }

            const startTime = new Date(data.startTime);
            const endTime = new Date(data.endTime);

            if (data.status === 'UPCOMING') {
                badge.className = 'status-badge upcoming';
                badge.textContent = 'UPCOMING';
                headerTime.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    Starts: ${startTime.toLocaleString()} - Ends: ${endTime.toLocaleString()}
                `;
                mainContainer.style.display = 'none'; // Hide leaderboard
            } else if (data.status === 'RUNNING') {
                badge.className = 'status-badge live';
                badge.textContent = 'LIVE';
                mainContainer.style.display = 'block';
                
                headerTime.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Ends: ${endTime.toLocaleString()}
                `;
            } else if (data.status === 'ENDED') {
                badge.className = 'status-badge ended';
                badge.textContent = 'ENDED';
                mainContainer.style.display = 'block';
                headerTime.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Ended: ${endTime.toLocaleString()}
                `;
            }
        }

        function renderLeaderboard(data, status) {
            const thead = document.getElementById('leaderboard-head');
            const tbody = document.getElementById('leaderboard-body');
            
            if (status === 'UPCOMING') {
                return; // Container is already hidden
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10">No data available yet</td></tr>';
                return;
            }

            // Extract problem count from the first row
            const firstRow = data[0];
            const numProblems = firstRow.problemStatuses ? firstRow.problemStatuses.length : 0;

            // Render Header dynamically
            let headerHtml = `
                <tr>
                    <th class="col-rank">Rank</th>
                    <th class="col-team">Participant</th>
                    <th class="col-score">Solved</th>
                    <th class="col-penalty">Penalty</th>
            `;
            
            // Calculate stats (AC / Total Attempts) just for UI flair
            let stats = Array(numProblems).fill({ ac: 0, total: 0 });
            data.forEach(row => {
                row.problemStatuses.forEach((prob, idx) => {
                    if (!stats[idx]) stats[idx] = { ac: 0, total: 0 };
                    stats[idx].total += prob.failedAttemptsCount + (prob.isSolved ? 1 : 0);
                    if (prob.isSolved) stats[idx].ac += 1;
                });
            });

            for (let i = 0; i < numProblems; i++) {
                headerHtml += `
                    <th class="col-prob">
                        <div class="prob-header">
                            <span class="prob-letter">${getProblemLetter(i)}</span>
                            <span class="prob-stats">${stats[i] ? stats[i].ac : 0}/${stats[i] ? stats[i].total : 0}</span>
                        </div>
                    </th>
                `;
            }
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            // Render Body
            tbody.innerHTML = '';
            
            // Determine First Solves
            let firstSolveTimes = Array(numProblems).fill(Infinity);
            data.forEach(row => {
                row.problemStatuses.forEach((prob, idx) => {
                    if (prob.isSolved && prob.solvedAtSeconds < firstSolveTimes[idx]) {
                        firstSolveTimes[idx] = prob.solvedAtSeconds;
                    }
                });
            });

            data.forEach(row => {
                const tr = document.createElement('tr');
                const initials = row.username.substring(0, 2).toUpperCase();

                let html = `
                    <td><div class="rank-badge">${row.rank}</div></td>
                    <td>
                        <div class="team-info">
                            <div class="team-avatar">${initials}</div>
                            <div>
                                <div class="team-name">${row.username}</div>
                                <div class="team-member">User ID: #${row.userId}</div>
                            </div>
                        </div>
                    </td>
                    <td><div class="score-solved">${row.problemsSolved}</div></td>
                    <td><div class="score-penalty">${row.totalPenalty}</div></td>
                `;

                row.problemStatuses.forEach((prob, idx) => {
                    let cellClass = "unattempted";
                    let content = "";

                    if (prob.isSolved) {
                        const isFirst = (prob.solvedAtSeconds === firstSolveTimes[idx] && prob.solvedAtSeconds > 0);
                        cellClass = isFirst ? "first" : "solved";
                        const penaltyText = prob.failedAttemptsCount > 0 ? `+${prob.failedAttemptsCount}` : "";
                        content = `
                            <div class="prob-time">${formatTime(prob.solvedAtSeconds)}</div>
                            <div class="prob-tries">${penaltyText}</div>
                        `;
                    } else if (prob.failedAttemptsCount > 0) {
                        cellClass = "failed";
                        content = `<div class="prob-tries">-${prob.failedAttemptsCount}</div>`;
                    }

                    html += `<td><div class="prob-cell ${cellClass}">${content}</div></td>`;
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function connectWebSocket() {
            // Adjust the endpoint based on your server URL, here assuming same origin /ws
            const socket = new SockJS('/codelearning/ws');
            stompClient = Stomp.over(socket);
            
            // Disable debug logs for production feel
            stompClient.debug = null;

            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                
                const topic = `/topic/contests/${contestId}/leaderboard`;
                stompClient.subscribe(topic, function (message) {
                    const payload = JSON.parse(message.body);
                    console.log('Leaderboard update received:', payload.event);
                    
                    // Add a subtle flash effect to header to show refresh
                    const badge = document.querySelector('.status-badge');
                    badge.style.transform = 'scale(1.1)';
                    setTimeout(() => badge.style.transform = 'scale(1)', 200);

                    // Fetch fresh data
                    fetchLeaderboard();
                });
            }, function (error) {
                console.error('WebSocket connection error:', error);
                // Attempt to reconnect after 5 seconds
                setTimeout(connectWebSocket, 5000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchLeaderboard();
            connectWebSocket();
        });
    </script>
</body>
</html>
