<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket - Testcase Generation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-top: 20px; background-color: #f9f9f9; }
        .log { margin-bottom: 5px; padding: 5px; border-bottom: 1px dashed #eee; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        .form-group { margin-bottom: 10px; }
        input[type="text"] { padding: 5px; width: 200px; }
        button { padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Test WebSocket - Testcase Generation</h2>
    
    <div class="form-group">
        <label for="problemId">Problem ID: </label>
        <input type="text" id="problemId" placeholder="Nhập ID bài toán (VD: 15)">
        <button id="connectBtn" onclick="connect()">Connect & Listen</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    </div>

    <div id="status" class="info">Trạng thái: Đã ngắt kết nối</div>

    <div id="messages"></div>

    <script>
        var stompClient = null;

        function connect() {
            var problemId = document.getElementById('problemId').value;
            if (!problemId) {
                alert("Vui lòng nhập Problem ID!");
                return;
            }

            // URL kết nối tới Spring Boot WebSocket (cấu hình trong app của bạn)
            var socket = new SockJS(window.location.origin + '/codelearning/ws');
            stompClient = Stomp.over(socket);

            document.getElementById('status').innerText = "Trạng thái: Đang kết nối...";

            stompClient.connect({}, function (frame) {
                document.getElementById('status').innerText = "Trạng thái: Đã kết nối thành công!";
                document.getElementById('status').className = "success";
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                
                logMessage("Connected: " + frame, "info");

                var topic = '/topic/testcase-generation/' + problemId;
                logMessage("Đang lắng nghe: " + topic, "info");

                // Subscribe vào topic của problem đó
                stompClient.subscribe(topic, function (messageOutput) {
                    var response = JSON.parse(messageOutput.body);
                    logMessage("NHẬN ĐƯỢC TIN NHẮN TỪ SERVER:", "success");
                    logMessage(JSON.stringify(response, null, 2), "success");
                });

            }, function (error) {
                document.getElementById('status').innerText = "Trạng thái: Lỗi kết nối!";
                document.getElementById('status').className = "error";
                logMessage("Error: " + error, "error");
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            document.getElementById('status').innerText = "Trạng thái: Đã ngắt kết nối";
            document.getElementById('status').className = "info";
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            logMessage("Disconnected", "info");
        }

        function logMessage(message, type) {
            var messagesDiv = document.getElementById('messages');
            var p = document.createElement('p');
            p.className = 'log ' + type;
            if(type === 'success' && message.startsWith("{")) {
                p.innerHTML = "<pre>" + message + "</pre>";
            } else {
                p.appendChild(document.createTextNode(message));
            }
            messagesDiv.appendChild(p);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
